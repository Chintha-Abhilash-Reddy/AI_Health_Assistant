version: '3.8'

services:
  web:
    build: .
    container_name: ai_health_assistant_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - HOST=0.0.0.0
      - PORT=5000
      - SECRET_KEY=generate_a_secure_production_secret_key_here
      - PUBLIC_WEB_URL=https://app.yourdomain.com
      - API_BASE_URL=https://app.yourdomain.com
      - ANDROID_STORE_URL=https://play.google.com/store/apps/details?id=com.health.aiassistant
      - IOS_STORE_URL=https://apps.apple.com/app/ai-health-assistant/id6739271845
      - ALLOWED_ORIGINS=*,https://app.yourdomain.com,capacitor://localhost
      - EMAIL_DEV_MODE=true
    volumes:
      - ./data:/app/data
      - ./static/uploads:/app/static/uploads
